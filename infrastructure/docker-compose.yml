services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: renault_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - saas-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - saas-network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/renault_db
      KC_DB_USERNAME: admin
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_URL: http://localhost:8080
      KC_HOSTNAME_ADMIN_URL: http://localhost:8080
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - saas-network

  backend:
    build:
      context: ../apps/backend
      dockerfile: ../../infrastructure/docker/Dockerfile.backend
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://admin:password@db:5432/renault_db?schema=public
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=admin
      - DB_PASSWORD=password
      - DB_NAME=renault_db
      - REDIS_URL=redis://redis:6379
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=reno
      - KEYCLOAK_CLIENT_ID=backend
    depends_on:
      - db
      - redis
      - keycloak
    networks:
      - saas-network

  frontend:
    build:
      context: ../apps/frontend
      dockerfile: ../../infrastructure/docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_DASHBOARD_API=http://backend:3001
      - NEXT_PUBLIC_API_URL=http://localhost:3001
      - NEXTAUTH_SECRET=my-super-secret-key-for-nextauth
      - NEXTAUTH_URL=http://localhost:3000
      - KEYCLOAK_INTERNAL_URL=http://keycloak:8080/realms/reno
      - KEYCLOAK_ISSUER=http://localhost:8080/realms/reno
      - KEYCLOAK_ID=reno
      - KEYCLOAK_SECRET=r1jJ2OQ8qg9qf10hI3I5zK5CjO2tV7Nn
    depends_on:
      - backend
    networks:
      - saas-network

networks:
  saas-network:
    driver: bridge

volumes:
  postgres_data:
