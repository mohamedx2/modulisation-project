name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
        
    - name: Install dependencies (Backend)
      run: |
        cd backend
        npm ci
        
    - name: Install dependencies (Frontend)
      run: |
        cd frontend
        npm ci
        
    - name: Lint (Backend)
      run: |
        cd backend
        npm run lint
        
    - name: Lint (Frontend)
      run: |
        cd frontend
        npm run lint
        
    - name: Test (Backend)
      run: |
        cd backend
        npm run test
